# ============================================================
# SOLO PARA DESARROLLO Y PRUEBAS.
# - Permite conexiones anónimas (allow_anonymous true).
# - Persiste sesiones y mensajes en /mosquitto/data.
# NO usar esta configuración en producción.
# ============================================================

# Escucha MQTT sin TLS en el puerto 1883.
listener 1883

# Permite conectarse sin usuario ni contraseña. Solo válido en desarrollo/pruebas.
allow_anonymous true

# Activa la persistencia: guarda suscripciones, sesiones y mensajes encolados
# para que sobrevivan a un reinicio del broker.
persistence true

# Directorio donde Mosquitto escribe su base de datos (mosquitto.db).
# Debe coincidir con el volumen nombrado "mosquitto-data" de compose.yaml.
persistence_location /mosquitto/data/

# Cada 30 segundos vuelca el estado a disco; también se guarda al apagarse.
autosave_interval 30

# Máximo de mensajes QoS 1/2 encolados por cliente desconectado. Al llenarse,
# la cola descarta mensajes (el límite protege la memoria del broker).
max_queued_messages 1000

# Caduca las sesiones persistentes inactivas después de 7 días, incluida su cola.
persistent_client_expiration 7d

# Publica los temas $SYS cada segundo para que el healthcheck de Compose
# (mosquitto_sub a $SYS/broker/uptime con -C 1 -W 5) responda con rapidez.
sys_interval 1
