# Configuración de Mosquitto SOLO para la prueba e2e Q9 (límite de cola).
# Igual que mosquitto/mosquitto.conf, pero con una cola muy pequeña para poder
# verificar empíricamente qué mensajes conserva el broker al llenarse.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 5
persistent_client_expiration 7d
sys_interval 1
